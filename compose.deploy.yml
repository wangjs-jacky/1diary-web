services:
  one-diary-web:
    image: nginx:1.27-alpine
    container_name: one-diary-web
    restart: unless-stopped
    ports:
      - "3080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
